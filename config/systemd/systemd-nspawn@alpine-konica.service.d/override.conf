# Host-side drop-in for Fedora's stock systemd-nspawn@.service template.
# Installed by scripts/install-host-integration.sh to
#   /etc/systemd/system/systemd-nspawn@alpine-konica.service.d/override.conf
#
# Design decision (see docs/architecture.md): reuse the distribution template
# for the container lifecycle, but replace its defaults so that:
#   * no private users (USB device access must work),
#   * no private network (host 127.0.0.1:8001 must reach PAPPL),
#   * no Alpine init (the PAPPL app itself is PID 1 in the container),
#   * failures restart with a bounded rate instead of a tight loop.

[Unit]
Description=Konica Minolta bizhub 206 PAPPL printer application (Alpine nspawn)
ConditionPathExists=/var/lib/machines/alpine-konica/usr/local/bin/konica206-native
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Type=simple
RemainAfterExit=no
# Clear the template's ExecStart (which boots /sbin/init with --network-veth
# and -U) before supplying our own.
ExecStart=
# @IPP_PORT@ is substituted by scripts/install-host-integration.sh so the same
# reviewed unit can be installed on an alternate port for side-by-side testing.
ExecStart=/usr/bin/systemd-nspawn --quiet --directory=/var/lib/machines/alpine-konica --machine=alpine-konica --settings=override /usr/local/bin/konica206-native server -o server-port=@IPP_PORT@ -o listen=localhost
Restart=on-failure
RestartSec=10s
TimeoutStopSec=30s
KillMode=mixed
